name: CI

on: 
  push:
    branches: ['main']
      
  
  pull_request: 
    branches: ['main']
      

jobs:
  test:
    runs-on: ubuntu-latest
  
  steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v5 

      with: 
        python-version: 3.12 

        cache: pip 

    - name: Install dependancies
      run: pip install -r requirements.txt pytest httpx ruff

    - name: Lint
      run: ruff check .
    
    - name: Run tests 
      run: pytest -v 


